<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate prompts — Prompt 150</title>
  <meta name="description" content="Generate prompts for 150-word microfiction on demand.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <script type="module" src="script/generate-page.js"></script>
  <link rel="stylesheet" href="style/index.css">
</head>

<body>
  <div class="backdrop" aria-hidden="true"></div>

  <div class="shell">
    <header class="masthead">
      <div class="masthead__identity">
        <h1 class="wordmark"><a href="index.html">Prompt <span>150</span></a></h1>
        <p class="tagline">Prompts for 150-word microfiction</p>
      </div>
      <div class="masthead__actions">
        <nav class="site-nav" aria-label="Main navigation">
          <a class="nav-link" href="index.html">This week</a>
          <a class="nav-link" href="about.html">What is this?</a>
        </nav>
        <theme-toggle></theme-toggle>
      </div>
    </header>

    <main class="stage">
      <p class="hero-copy">
        Start with five sparks, then keep the ideas coming. Add prompts one at a
        time, or clear the slate and generate a completely new set.
      </p>
      <header class="page-heading page-heading--with-action">
        <div>
          <p class="page-heading__eyebrow">Keep going for as long as you like</p>
          <h2 class="page-heading__title">Generate prompts</h2>
        </div>
        <div class="page-heading__actions">
          <button class="button" type="button" data-action="add">Add a prompt</button>
          <button class="button button--primary" type="button" data-action="regenerate">
            <span aria-hidden="true">&#9733;</span> Regenerate prompts
          </button>
        </div>
      </header>
      <ol class="prompt-list" data-generated-prompts aria-live="polite"></ol>
    </main>

    <footer class="colophon">
      <p><kbd>Space</kbd> adds a prompt.</p>
    </footer>
  </div>
</body>

</html>
